version: '3.8'

services:
  adaptive-ipi:
    build:
      context: .
      dockerfile: Dockerfile
    image: adaptive-ipi-v2:latest
    container_name: adaptive_ipi_v2
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
